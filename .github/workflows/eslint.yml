name: ESLint Pull Request Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: yarn install

      - name: 🐞 Debug ESLint config
        run: |
          echo "Working directory: $PWD"
          ls -la
          ls -la .eslintrc.*

      - name: Run ESLint Comment Action
        uses: anhbt-2663/sun-eslint-comment-action@v1.2.20
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
